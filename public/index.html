<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atualiza | Notícias sobre IA, redes sociais e cognição</title>
<meta name="description" content="Notícias em português sobre inteligência artificial, redes sociais, atenção e cognição, atualizadas o dia todo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar">
  <div class="wrap topbar__in">
    <span id="data"></span>
    <span class="trending" id="trending" hidden><b>Em alta</b><a id="trend" href="#" target="_blank" rel="noopener noreferrer"></a></span>
    <a class="gh" href="https://github.com/JanieliSilva/NoticiasApi" target="_blank" rel="noopener noreferrer">GitHub</a>
  </div>
</div>

<header class="site">
  <div class="wrap site__in">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"></span>atualiza</a>
    <div class="search"><input type="search" id="busca" placeholder="Buscar por título ou fonte" aria-label="Buscar notícias"></div>
    <div class="actions"><span id="stamp">Carregando...</span><button class="btn" id="refresh" type="button">Atualizar</button></div>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Temas" hidden>
  <div class="wrap"><div class="tabs__in" id="chips"></div></div>
</nav>

<main class="wrap">
  <p class="status" id="status" role="status"></p>
  <section class="feature" id="feature" aria-live="polite"></section>
  <div class="split" id="split" hidden>
    <section id="miss" hidden></section>
    <aside id="top" hidden></aside>
  </div>
  <section id="mais" hidden></section>
  <section id="results" hidden></section>
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <span class="brand"><span class="logo" aria-hidden="true"></span>atualiza</span>
    <span>Atualiza sozinho a cada 5 minutos. Notícias via NewsAPI.</span>
  </div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const REFRESH_MS = 5 * 60 * 1000;
let todas = [], vistas = new Set(), temaAtivo = "Todos", ultima = 0;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

// Aceita português ou formato NewsAPI.
function normaliza(n) {
  const f = (n.fonte && n.fonte.name) || n.fonte || (n.source && n.source.name) || n.source || "";
  const t = Date.parse(n.data || n.publishedAt || n.publicadoEm || "");
  return {
    titulo: n.titulo || n.title || "Sem título",
    descricao: n.descricao || n.description || "",
    imagem: n.imagem || n.urlToImage || n.image || "",
    url: n.url || n.link || "#",
    fonte: typeof f === "string" ? f : "",
    t: isNaN(t) ? 0 : t,
    tema: n.tema || n.categoria || (Array.isArray(n.temas) ? n.temas[0] : "") || "",
    novo: false
  };
}

function rel(t) {
  if (!t) return "";
  const s = (Date.now() - t) / 1000;
  if (s < 60) return "agora";
  const m = Math.floor(s / 60); if (m < 60) return "há " + m + " min";
  const h = Math.floor(m / 60); if (h < 24) return "há " + h + " h";
  const d = Math.floor(h / 24); if (d < 7) return "há " + d + (d === 1 ? " dia" : " dias");
  return new Date(t).toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}

/* ---------- blocos reutilizáveis ---------- */
function link(cls, n) { const a = el("a", cls); a.href = n.url; a.target = "_blank"; a.rel = "noopener noreferrer"; return a; }
function foto(n, cls) {
  if (!n.imagem) return null;
  const im = el("img", cls); im.src = n.imagem; im.alt = ""; im.loading = "lazy"; im.onerror = () => im.remove(); return im;
}
function meta(n) {
  const m = el("div", "meta");
  if (n.fonte) m.appendChild(el("span", "", n.fonte));
  if (n.t) { const s = el("span", "time", rel(n.t)); s.dataset.t = n.t; m.appendChild(s); }
  if (n.novo) m.appendChild(el("span", "novo", "nova"));
  return m;
}
function titulo(txt) { const d = el("div", "section-title"); d.appendChild(el("h2", "", txt)); return d; }

function hero(n) {
  const a = el("article", "hero"), f = foto(n); if (f) a.appendChild(f);
  const b = el("div", "hero__body");
  b.appendChild(el("span", "tag", n.tema || "Em destaque"));
  const h = el("h1"), l = link("", n); l.textContent = n.titulo; h.appendChild(l); b.appendChild(h);
  if (n.descricao) b.appendChild(el("p", "", n.descricao));
  b.appendChild(meta(n));
  const go = link("go", n); go.textContent = "Ler matéria"; b.appendChild(go);
  a.appendChild(b); return a;
}
function painel(lista) {
  const p = el("aside", "panel"); p.appendChild(titulo("Mais recentes"));
  lista.forEach((n) => { const a = link("prow", n); a.appendChild(el("h3", "", n.titulo)); a.appendChild(meta(n)); p.appendChild(a); });
  return p;
}
function tile(n, grande) {
  const a = link("tile" + (grande ? " tile--big" : ""), n), f = foto(n); if (f) a.appendChild(f);
  if (n.tema) a.appendChild(el("span", "tag", n.tema));
  const b = el("div", "tile__body"); b.appendChild(el("h3", "", n.titulo)); b.appendChild(meta(n));
  a.appendChild(b); return a;
}
function card(n) {
  const a = link("card", n), f = foto(n, "card__img");
  a.appendChild(f || el("div", "card__ph"));
  const b = el("div", "card__body");
  if (n.tema) b.appendChild(el("span", "tag", n.tema));
  b.appendChild(el("h3", "", n.titulo)); b.appendChild(meta(n));
  a.appendChild(b); return a;
}
const gradeBento = (l) => { const g = el("div", "bento"); l.forEach((n, i) => g.appendChild(tile(n, i === 0))); return g; };
const gradeCards = (l) => { const g = el("div", "cards"); l.forEach((n) => g.appendChild(card(n))); return g; };
function listaTop(l) {
  const o = el("ol", "toplist");
  l.forEach((n, i) => {
    const li = el("li"), a = link("trow", n); a.appendChild(el("span", "num", String(i + 1)));
    const c = el("div"); c.appendChild(el("h3", "", n.titulo)); c.appendChild(meta(n)); a.appendChild(c);
    const f = foto(n, "thumb"); if (f) a.appendChild(f);
    li.appendChild(a); o.appendChild(li);
  });
  return o;
}
function bloco(id, txt, itens, montar) {
  const b = $(id); b.replaceChildren(); b.hidden = !itens.length;
  if (!itens.length) return;
  b.appendChild(titulo(txt)); b.appendChild(montar(itens));
}

/* ---------- desenho da página ---------- */
function desenha() {
  const q = $("busca").value.trim().toLowerCase();
  const lista = todas.filter((n) => (temaAtivo === "Todos" || n.tema === temaAtivo) && (!q || (n.titulo + " " + n.fonte).toLowerCase().includes(q)));
  const filtrando = Boolean(q) || temaAtivo !== "Todos";
  $("status").className = "status";
  $("status").textContent = lista.length ? "" : "Nenhuma notícia encontrada. Tente outro termo ou tema.";

  const tr = $("trending"); tr.hidden = !todas.length;
  if (todas.length) { $("trend").textContent = todas[0].titulo; $("trend").href = todas[0].url; }

  const feat = $("feature"); feat.replaceChildren();
  if (filtrando) {
    ["split", "mais"].forEach((id) => { $(id).hidden = true; });
    bloco("results", q ? "Resultados para “" + $("busca").value.trim() + "”" : temaAtivo, lista, gradeCards);
    return;
  }
  $("results").hidden = true;
  if (lista[0]) { feat.appendChild(hero(lista[0])); if (lista.length > 1) feat.appendChild(painel(lista.slice(1, 6))); }
  bloco("miss", "Não perca", lista.slice(6, 11), gradeBento);
  bloco("top", "Top histórias", lista.slice(11, 16), listaTop);
  $("split").hidden = $("miss").hidden && $("top").hidden;
  bloco("mais", "Mais notícias", lista.slice(16), gradeCards);
}

function desenhaTemas() {
  const temas = ["Todos", ...new Set(todas.map((n) => n.tema).filter(Boolean))];
  const box = $("chips"); box.replaceChildren();
  $("tabs").hidden = temas.length < 3;
  temas.forEach((t) => {
    const b = el("button", "tab", t); b.type = "button"; b.setAttribute("aria-pressed", String(t === temaAtivo));
    b.onclick = () => { temaAtivo = t; desenhaTemas(); desenha(); };
    box.appendChild(b);
  });
}

function tique() {
  document.querySelectorAll(".time").forEach((e) => { e.textContent = rel(Number(e.dataset.t)); });
  if (ultima) { const r = rel(ultima); $("stamp").textContent = "Atualizado " + r; }
}

async function carrega() {
  const btn = $("refresh"); btn.classList.add("spin"); btn.disabled = true;
  try {
    const r = await fetch("/api/noticias");
    if (!r.ok) throw new Error("a API respondeu com erro " + r.status);
    const acha = (d) => {
      if (Array.isArray(d)) return d;
      if (d && typeof d === "object") {
        for (const k of Object.keys(d)) if (Array.isArray(d[k])) return d[k];
        for (const k of Object.keys(d)) { const x = acha(d[k]); if (x.length) return x; }
      }
      return [];
    };
    const lista = acha(await r.json()).map(normaliza).sort((a, b) => b.t - a.t);
    const primeira = vistas.size === 0;
    lista.forEach((n) => { n.novo = !primeira && !vistas.has(n.url); vistas.add(n.url); });
    todas = lista; ultima = Date.now();
    desenhaTemas(); desenha(); tique();
  } catch (e) {
    $("status").className = "status erro";
    $("status").textContent = "Não foi possível atualizar: " + e.message + ". Confira se o servidor está rodando.";
    $("stamp").textContent = "Sem conexão com a API";
  } finally { btn.classList.remove("spin"); btn.disabled = false; }
}

$("data").textContent = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
$("busca").addEventListener("input", desenha);
$("refresh").addEventListener("click", carrega);
setInterval(tique, 30000);
setInterval(carrega, REFRESH_MS);
carrega();
</script>
</body>
</html>
